# Verification for the Crow/AAP alarm integration, Home Assistant 2026.9.
#
# This replaces the generic "Python application" template that shipped with the
# repository. That template pinned Python 3.10 (this integration targets Home
# Assistant 2026.9, which requires Python 3.14.2+) and ran `pytest` over a
# repository that contains no pytest tests, so it could only ever fail.
#
# The three harnesses below are the project's real verification. They stub the
# Home Assistant modules they use, so no Home Assistant installation, no
# hardware and no network access are required.

name: Verify

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install harness dependencies
        run: python -m pip install --upgrade pip voluptuous

      - name: Protocol driver self-test
        run: python test_crow_protocol.py

      - name: Home Assistant 2026.9 contract
        run: python tests/verify_ha_2026_contract.py

      - name: Config flow and translations
        run: python tests/verify_config_flow.py
